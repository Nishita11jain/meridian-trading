name: CI

on:
  push:
  pull_request:

jobs:
  auth-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/auth-service/package-lock.json }
      - run: npm install -g npm@11   # Node 22 ships npm 10, which fails `npm ci` against this lock file
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high   # shipped dependencies only; dev tooling is reviewed separately
      - run: npm run test:cov   # fails below the coverageThreshold in jest.config.cjs

  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify
        working-directory: services/order-service

  executor-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify
        working-directory: services/executor-service

  etl-layer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: etl-layer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" pytest-cov
      - run: pytest --cov=src --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install -g npm@11   # Node 22 ships npm 10, which fails `npm ci` against this lock file
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # shipped dependencies only; dev tooling is reviewed separately
      - run: npx ng build
      - run: npm run test:scripts
      - run: npx ng test --no-watch
      - run: node scripts/scan-bundle.mjs

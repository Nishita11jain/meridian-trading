<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Architecture Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one system diagram on the left, a detail panel on the right; three modes (explore, flows, build order) drive the same diagram. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #14212b; --muted: #566876; --line: #c3ced7;
  --accent: #0b7a75; --accent-soft: #d9efed; --hot: #c2610a; --hot-soft: #fbe9d4; --node: #f7f9fb;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620; --surface: #132230; --ink: #e5edf2; --muted: #93a6b4; --line: #2b4054;
    --accent: #3cc5ba; --accent-soft: #123a3d; --hot: #f5a524; --hot-soft: #3d2c10; --node: #172a3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1620; --surface: #132230; --ink: #e5edf2; --muted: #93a6b4; --line: #2b4054;
  --accent: #3cc5ba; --accent-soft: #123a3d; --hot: #f5a524; --hot-soft: #3d2c10; --node: #172a3a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 62ch; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.tabs button { font: inherit; font-weight: 500; padding: 8px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-right: 1px solid var(--line); }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { color: #06201f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-selected="true"] { color: #06201f; } }
button:focus-visible, .node:focus-visible, .chip:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 920px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.stage { padding: 12px; display: grid; gap: 12px; min-width: 0; }
.svgbox { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 640px; height: auto; }
figure { margin: 0; }
figcaption { color: var(--muted); font-size: 12.5px; padding: 8px 4px 0; }

/* diagram */
.node rect.box { fill: var(--node); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s, fill .15s, opacity .2s; }
.node.ext rect.box { stroke-dasharray: 5 4; }
.node { cursor: pointer; transition: opacity .2s; }
.node:hover rect.box { stroke: var(--accent); }
.node.sel rect.box { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.node.hot rect.box { stroke: var(--hot); stroke-width: 2.5; }
.node text { fill: var(--ink); pointer-events: none; }
.node .t { font: 600 14px var(--sans); }
.node .s { font: 400 11.5px var(--sans); fill: var(--muted); }
.node .p { font: 500 11px var(--mono); fill: var(--accent); }
.node.dim { opacity: .18; }
.edge path { fill: none; stroke: var(--muted); stroke-width: 1.5; transition: stroke .15s, opacity .2s; }
.edge.dotted path { stroke-dasharray: 3 4; }
.edge text { font: 500 10.5px var(--mono); fill: var(--muted); }
.edge.dim { opacity: .12; }
.edge.on path { stroke: var(--hot); stroke-width: 3; }
.edge.on text { fill: var(--hot); font-weight: 600; }
.edge.faint path { opacity: .35; }
.edge.faint text { opacity: .45; }
.badge circle { fill: var(--hot); }
.badge text { font: 600 11px var(--sans); fill: #fff; text-anchor: middle; }
#arrow path, #arrowhot path { stroke: none; }
#arrow path { fill: var(--muted); }
#arrowhot path { fill: var(--hot); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 4px; }
.chips .lab { font: 500 11px var(--mono); color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; }
.chip { font: 500 12px var(--sans); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--node); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .chip.sel { color: #06201f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.sel { color: #06201f; } }

/* controls */
.ctl { border-top: 1px solid var(--line); padding: 12px 4px 4px; display: grid; gap: 10px; }
.ctl[hidden] { display: none; }
.pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 500 12.5px var(--sans); padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--node); color: var(--ink); cursor: pointer; }
.pill[aria-pressed="true"] { border-color: var(--hot); background: var(--hot-soft); }
.stepbar { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.nav { font: 600 13px var(--sans); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.nav:disabled { opacity: .4; cursor: default; }
.nav.go { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .nav.go { color: #06201f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav.go { color: #06201f; } }
.steptext { min-height: 3.2em; }
.steptext b { color: var(--hot); font-family: var(--mono); font-weight: 600; margin-right: 6px; }
.steptext code, .panel code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.d { background: var(--hot); }

/* panel */
.panel { padding: 18px; display: grid; gap: 14px; position: sticky; top: 12px; min-width: 0; }
@media (max-width: 920px) { .panel { position: static; } }
.panel h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
.panel .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 500 11px var(--mono); padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.ext { background: var(--bg); color: var(--muted); }
.panel p { margin: 0; }
.panel h3 { margin: 0 0 4px; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.panel .files { list-style: none; padding: 0; }
.panel .files li { font: 400 12px var(--mono); overflow-wrap: anywhere; color: var(--ink); }
.panel .say { border-left: 3px solid var(--hot); padding: 4px 0 4px 10px; background: var(--hot-soft); border-radius: 0 6px 6px 0; }
.empty { color: var(--muted); }
.hint { color: var(--muted); font-size: 12.5px; text-align: center; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Meridian architecture map</h1>
      <p class="sub">Every part of the trading platform and how an order moves through it. Click a box to see how it was built, or step through a flow.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-explore" aria-selected="true" data-mode="explore">Explore</button>
      <button role="tab" id="tab-flows" aria-selected="false" data-mode="flows">Flows</button>
      <button role="tab" id="tab-build" aria-selected="false" data-mode="build">Build order</button>
    </div>
  </header>

  <div class="main">
    <section class="card stage" aria-label="System diagram">
      <figure>
        <div class="svgbox">
          <svg id="dia" viewBox="0 0 1000 650" role="img" aria-label="Architecture of the Meridian trading platform: the Angular UI calls the auth service and the Trade API; the Trade API stores orders in PostgreSQL and publishes them to Kafka; the executor consumes them, settles in PostgreSQL and publishes outcomes back to Kafka; market data and FX come from the Fauxnance API.">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
              <marker id="arrowhot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
            </defs>
            <g id="edges"></g>
            <g id="nodes"></g>
            <g id="badge" class="badge" hidden></g>
          </svg>
        </div>
        <figcaption id="caption">Solid boxes are our code. Dashed boxes are outside services. Arrows show who calls whom.</figcaption>
      </figure>

      <div class="chips" id="chips" role="group" aria-label="Trade API modules"><span class="lab">Trade API modules</span></div>

      <div class="ctl" id="ctl-flows" hidden>
        <div class="pillrow" id="flowpills" role="group" aria-label="Choose a flow"></div>
        <div class="steptext" id="steptext" aria-live="polite"></div>
        <div class="stepbar">
          <button class="nav" id="fprev">Back</button>
          <div class="dots" id="fdots"></div>
          <button class="nav go" id="fnext">Next</button>
        </div>
      </div>

      <div class="ctl" id="ctl-build" hidden>
        <div class="pillrow" id="buildpills" role="group" aria-label="Choose a sprint"></div>
        <div class="steptext" id="buildtext" aria-live="polite"></div>
        <div class="stepbar">
          <button class="nav" id="bprev">Previous sprint</button>
          <div class="dots" id="bdots"></div>
          <button class="nav go" id="bnext">Next sprint</button>
        </div>
      </div>
      <p class="hint">Present with <kbd>←</kbd> <kbd>→</kbd> to step, <kbd>Esc</kbd> to clear the selection.</p>
    </section>

    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>

  };

  var DETAIL = {
    ui: {
      title: 'Angular trading UI', tags: ['Sprint 9', 'Angular · TypeScript', 'port 4200'],

  var SPRINTS = [
    { n: 3, label: 'Sprint 3', title: 'Trade database', text: 'Start with the data: accounts, instruments, orders and positions, with exact decimals, optimistic-lock versions and a constraint against duplicate orders.' },
    { n: 4, label: 'Sprint 4', title: 'Analytics ETL', text: 'A Python pipeline pulls market data from Fauxnance into DuckDB, so the team understood the data before building on it.' },
    { n: 5, label: 'Sprint 5', title: 'Domain engine', text: 'The trading rules as pure Java, with a build rule that bans framework imports. This is where Money, Order and Position live.' },
    { n: 6, label: 'Sprint 6', title: 'Trade API', text: 'A Spring Boot REST service wrapping the domain and the database: JWT verification, optimistic locking, and orders that reach a real terminal status.' },
    { n: 7, label: 'Sprint 7', title: 'Event backbone', text: 'Kafka decouples taking orders from executing them. The executor was split into its own service, with a market-data poller and an incremental FACT_TRADES load.' },
    { n: 8, label: 'Sprint 8', title: 'Auth service', text: 'A real token issuer replaces the test stub: registration, login, refresh, argon2id hashing, throttling and a written security review.' },

  ];

  /* ---------- state ---------- */
  var state = { mode: 'explore', sel: null, flow: 'order', step: 0, sprint: 11 };

  /* ---------- build svg ---------- */
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  var gEdges = document.getElementById('edges'), gNodes = document.getElementById('nodes');
  Object.keys(EDGES).forEach(function (id) {
    var e = EDGES[id];
    var g = el('g', { 'class': 'edge' + (e.dotted ? ' dotted' : ''), 'data-id': id }, gEdges);
    var p = el('path', { d: e.d, 'marker-end': 'url(#arrow)' }, g);
    var t = el('text', { x: e.lx, y: e.ly, 'text-anchor': e.anchor || 'middle' }, g);
    t.textContent = e.lab;
    edgeEls[id] = { g: g, path: p };
  });

  Object.keys(NODES).forEach(function (id) {
    var n = NODES[id];
    var g = el('g', { 'class': 'node' + (n.ext ? ' ext' : ''), 'data-id': id, tabindex: 0, role: 'button', 'aria-label': n.t + ', ' + n.s }, gNodes);
    el('rect', { 'class': 'box', x: n.x, y: n.y, width: n.w, height: n.h, rx: 8 }, g);
    var t = el('text', { 'class': 't', x: n.x + 14, y: n.y + 26 }, g); t.textContent = n.t;
    if (id === 'kafka') {
      ['orders ×3', 'trade-events ×3', 'market-data ×6'].forEach(function (l, i) {
        var s = el('text', { 'class': 's', x: n.x + 14, y: n.y + 52 + i * 17, style: 'font-family:var(--mono);font-size:11px' }, g); s.textContent = l;
      });
    } else {
      var s = el('text', { 'class': 's', x: n.x + 14, y: n.y + 46 }, g); s.textContent = n.s;
    }
    var p = el('text', { 'class': 'p', x: n.x + 14, y: n.y + n.h - 12 }, g); p.textContent = n.p;
    g.addEventListener('click', function () { select(id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(id); } });
    nodeEls[id] = g;
  });

  /* ---------- chips ---------- */
  var chipsBox = document.getElementById('chips'), chipEls = {};
  MODULES.forEach(function (m) {
    var b = document.createElement('button');

    chipsBox.appendChild(b); chipEls[m.id] = b;

  /* ---------- panel ---------- */
  var panel = document.getElementById('panel');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function listHtml(items, cls) { return '<ul' + (cls ? ' class="' + cls + '"' : '') + '>' + items.map(function (i) { return '<li>' + (cls ? esc(i) : i.replace(/&(?!amp;)/g, '&amp;')) + '</li>'; }).join('') + '</ul>'; }

  function talksTo(id) {
    var out = [];
    Object.keys(EDGES).forEach(function (k) {
      var e = EDGES[k];
      if (e.from === id) out.push('Calls ' + NODES[e.to].t + ' (' + e.lab + ')');
      if (e.to === id && NODES[e.from]) out.push('Called by ' + NODES[e.from].t + ' (' + e.lab + ')');
    });
    return out;
  }

  function renderPanel() {
    var id = state.sel;
    if (!id) {
      panel.innerHTML = '<h2>Pick a part</h2><p class="empty">Click any box or module to see what it does, how it was built, and which files to open if you are asked about it.</p>' +
        '<div><h3>Ports</h3><ul><li>Frontend <code>4200</code></li><li>Auth service <code>3000</code></li><li>Trade API <code>8081</code></li><li>Executor <code>8082</code></li></ul></div>';
      return;
    }
    var d = DETAIL[id] || MODULES.filter(function (m) { return m.id === id; })[0];
    var html = '<div><div class="meta">' + d.tags.map(function (t, i) { return '<span class="tag' + (t === 'External' ? ' ext' : '') + '">' + esc(t) + '</span>'; }).join('') + '</div></div>';
    html += '<h2>' + esc(d.title) + '</h2><p>' + d.what + '</p>';
    html += '<div><h3>How it works</h3>' + listHtml(d.how) + '</div>';
    if (DETAIL[id]) { var tt = talksTo(id); if (tt.length) html += '<div><h3>Talks to</h3>' + listHtml(tt) + '</div>'; }
    html += '<div><h3>Open these files</h3>' + listHtml(d.files, 'files') + '</div>';
    if (d.say) html += '<p class="say">' + d.say + '</p>';
    panel.innerHTML = html;
  }

  /* ---------- rendering ---------- */
  function visible(sprint) { return state.mode !== 'build' || sprint <= state.sprint; }

  function render() {
    var flow = FLOWS.filter(function (f) { return f.id === state.flow; })[0];
    var step = flow.steps[state.step];
    var active = state.mode === 'flows' ? step.e : null;
    var activeEdge = active ? EDGES[active] : null;

    Object.keys(NODES).forEach(function (id) {
      var n = NODES[id], g = nodeEls[id];
      g.classList.toggle('sel', state.sel === id);
      g.classList.toggle('dim', !visible(n.sprint));
      g.classList.toggle('hot', !!activeEdge && (activeEdge.from === id || activeEdge.to === id));
    });
    Object.keys(EDGES).forEach(function (id) {
      var e = EDGES[id], o = edgeEls[id];
      var show = visible(e.sprint) && visible(NODES[e.from].sprint) && visible(NODES[e.to].sprint);
      o.g.classList.toggle('dim', !show);
      o.g.classList.toggle('on', active === id);
      o.g.classList.toggle('faint', state.mode === 'flows' && active !== id);
      o.path.setAttribute('marker-end', 'url(#' + (active === id ? 'arrowhot' : 'arrow') + ')');
      if (active === id && step.rev) { o.path.setAttribute('marker-end', 'url(#arrowhot)'); }
    });
    MODULES.forEach(function (m) { chipEls[m.id].classList.toggle('sel', state.sel === m.id); });

    // step badge
    var badge = document.getElementById('badge');
    while (badge.firstChild) badge.removeChild(badge.firstChild);
    if (active) {
      var p = edgeEls[active].path, len = p.getTotalLength(), pt = p.getPointAtLength(len / 2);
      el('circle', { cx: pt.x, cy: pt.y, r: 11 }, badge);
      var t = el('text', { x: pt.x, y: pt.y + 4 }, badge); t.textContent = state.step + 1;
      badge.removeAttribute('hidden');
    } else { badge.setAttribute('hidden', ''); }

    // controls
    document.getElementById('ctl-flows').hidden = state.mode !== 'flows';
    document.getElementById('ctl-build').hidden = state.mode !== 'build';
    ['explore', 'flows', 'build'].forEach(function (m) { document.getElementById('tab-' + m).setAttribute('aria-selected', String(state.mode === m)); });
    document.getElementById('chips').hidden = state.mode === 'flows';

    if (state.mode === 'flows') {
      document.querySelectorAll('#flowpills .pill').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.id === state.flow)); });
      document.getElementById('steptext').innerHTML = '<b>' + (state.step + 1) + '/' + flow.steps.length + '</b>' + step.t;
      document.getElementById('fprev').disabled = state.step === 0;
      document.getElementById('fnext').disabled = state.step === flow.steps.length - 1;
      document.getElementById('fdots').innerHTML = flow.steps.map(function (s, i) { return '<i class="' + (i <= state.step ? 'd' : '') + '"></i>'; }).join('');
      document.getElementById('caption').textContent = 'Flow: ' + flow.label + '. The numbered arrow is the current step.';
    } else if (state.mode === 'build') {
      var sp = SPRINTS.filter(function (s) { return s.n === state.sprint; })[0], idx = SPRINTS.indexOf(sp);
      document.querySelectorAll('#buildpills .pill').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.n) === state.sprint)); });
      document.getElementById('buildtext').innerHTML = '<b>' + sp.label + '</b><strong>' + sp.title + '.</strong> ' + sp.text;
      document.getElementById('bprev').disabled = idx === 0;
      document.getElementById('bnext').disabled = idx === SPRINTS.length - 1;
      document.getElementById('bdots').innerHTML = SPRINTS.map(function (s, i) { return '<i class="' + (i <= idx ? 'd' : '') + '"></i>'; }).join('');
      document.getElementById('caption').textContent = 'Build order: faded parts did not exist yet at this sprint.';
    } else {
      document.getElementById('caption').textContent = 'Solid boxes are our code. Dashed boxes are outside services. Arrows show who calls whom.';
    }
    renderPanel();
  }

  function select(id) { state.sel = state.sel === id ? null : id; render(); }

  /* ---------- controls wiring ---------- */
  var fp = document.getElementById('flowpills');
  FLOWS.forEach(function (f) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.dataset.id = f.id; b.textContent = f.label;
    b.addEventListener('click', function () { state.flow = f.id; state.step = 0; render(); });
    fp.appendChild(b);
  });
  var bp = document.getElementById('buildpills');
  SPRINTS.forEach(function (s) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.dataset.n = s.n; b.textContent = s.label;
    b.addEventListener('click', function () { state.sprint = s.n; render(); });
    bp.appendChild(b);
  });

  function flowSteps() { return FLOWS.filter(function (f) { return f.id === state.flow; })[0].steps.length; }
  function next() {
    if (state.mode === 'flows') { if (state.step < flowSteps() - 1) state.step++; }
    else if (state.mode === 'build') { var i = SPRINTS.findIndex(function (s) { return s.n === state.sprint; }); if (i < SPRINTS.length - 1) state.sprint = SPRINTS[i + 1].n; }
    render();
  }
  function prev() {
    if (state.mode === 'flows') { if (state.step > 0) state.step--; }
    else if (state.mode === 'build') { var i = SPRINTS.findIndex(function (s) { return s.n === state.sprint; }); if (i > 0) state.sprint = SPRINTS[i - 1].n; }
    render();
  }
  document.getElementById('fnext').addEventListener('click', next);
  document.getElementById('fprev').addEventListener('click', prev);
  document.getElementById('bnext').addEventListener('click', next);
  document.getElementById('bprev').addEventListener('click', prev);

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.mode = b.dataset.mode;
      if (state.mode === 'build') state.sprint = SPRINTS[0].n;
      if (state.mode === 'flows') state.step = 0;
      render();
    });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowRight') { next(); }
    else if (ev.key === 'ArrowLeft') { prev(); }
    else if (ev.key === 'Escape') { state.sel = null; render(); }
  });

  render();
})();
